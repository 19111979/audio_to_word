<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Transcrição de Áudio</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .header { text-align: center; border-bottom: 2px solid #333; padding-bottom: 20px; }
        .metadata { margin: 20px 0; padding: 15px; background: #f5f5f5; }
        .transcription { line-height: 1.6; margin-top: 30px; }
        .footer { margin-top: 50px; text-align: center; font-size: 12px; color: #666; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Transcrição de Áudio</h1>
    </div>
    
    <div class="metadata">
        <p><strong>Data:</strong> {{ date }}</p>
        <p><strong>Arquivo:</strong> {{ filename }}</p>
        <p><strong>Modelo:</strong> {{ model }}</p>
        <p><strong>Duração:</strong> {{ duration }} segundos</p>
    </div>
    
    <div class="transcription">
        <h2>Transcrição</h2>
        <p>{{ transcription }}</p>
    </div>
    
    <div class="footer">
        Documento gerado automaticamente - Conversor de Áudio para Word
    </div>
</body>
</html>
